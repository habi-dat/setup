name: CI

on:
  push:
    # Every branch, so work in progress is tested before it reaches main. The
    # release tags (32.0.5, 31.0.2, ...) are deliberately excluded: a bare
    # `push:` would also fire on tag pushes, re-testing a commit its branch
    # already covered.
    branches: ['**']
  # Needed on top of the push trigger for pull requests from forks, whose
  # branches live in another repository and so never push here.
  pull_request:
  workflow_dispatch:

concurrency:
  # A push that supersedes an in-flight run cancels it.
  #
  # head_ref (the PR's source branch) and ref_name (the pushed branch) resolve
  # to the same string, so a same-repo pull request collapses into one run
  # instead of racing its own branch push.
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The flake pins bats, shellcheck, Python with Jinja2 and the docker CLI,
      # so CI and a developer's `nix develop` run the same versions.
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Cache the Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Show the environment
        run: |
          nix develop .#ci --command bats --version
          nix develop .#ci --command shellcheck --version
          nix develop .#ci --command python3 -c "import jinja2; print(f'jinja2 {jinja2.__version__}')"
          nix develop .#ci --command docker --version

      - name: Run the test suite
        run: nix develop .#ci --command ./tests/run.sh

  # Verifies the npm path still works, so a contributor without Nix can run the
  # suite. The static tier skips here (no shellcheck).
  test-npm:
    name: Test suite (npm, no Nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # lib/render.py needs only Jinja2 and works on any current Python, so this
      # is the whole template-rendering dependency. Installed from apt rather
      # than pip to match how a server would get it.
      - name: Install Jinja2
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-jinja2
          ./lib/render.py --help >/dev/null

      - name: Install test dependencies
        run: npm ci

      - name: Run the test suite
        run: ./tests/run.sh

  # Real installs against a live Docker daemon. Not a merge gate: image pulls
  # and the hardcoded sleep 30 / sleep 120 waits in the module scripts make this
  # slow and occasionally flaky.
  #
  # Enable the schedule once the suite has proven stable.
  integration:
    name: Integration (nginx + auth + nextcloud)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27

      - name: Prepare a development configuration
        run: |
          cp tests/helpers/profiles/dev.env setup.env
          sed -i 's|^HABIDAT_BACKUP_DIR=.*|HABIDAT_BACKUP_DIR='"$PWD"'/backup|' setup.env
          mkdir -p backup

      - name: Trust the mkcert CA
        run: nix develop --command mkcert -install

      # One module at a time and in dependency order on purpose: installing
      # nextcloud directly would hit check_dependencies' interactive
      # "Install them? [y/n]" prompt, which has no stdin on a runner.
      - name: Install nginx
        run: nix develop --command ./habidat.sh install nginx

      - name: Install auth
        run: nix develop --command ./habidat.sh install auth

      - name: Install nextcloud
        run: nix develop --command ./habidat.sh install nextcloud

      - name: Show module status
        run: nix develop --command ./habidat.sh modules

      - name: Export and re-import auth
        run: |
          nix develop --command ./habidat.sh export auth
          nix develop --command ./habidat.sh import auth list

      - name: Collect container logs on failure
        if: failure()
        run: docker ps -a && docker compose ls || true
